# Input for the carton-merge Cart Transform.
# The theme's carton builder adds each pick as its own line with two hidden
# line properties: _carton_id (shared by one carton's lines) and
# _carton_parent (the carton product's variant id).
query CartTransformRunInput {
  cart {
    lines {
      id
      quantity
      cartonId: attribute(key: "_carton_id") {
        value
      }
      cartonParent: attribute(key: "_carton_parent") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          title
          product {
            title
          }
        }
      }
    }
  }
}
